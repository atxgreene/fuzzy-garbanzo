name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Site integrity (CSP hashes, JS syntax, JSON, structure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run verification suite
        run: python3 scripts/verify.py
